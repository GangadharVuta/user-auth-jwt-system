server.port=8080

# Spring Application Name
spring.application.name=user-auth-jwt-system

# H2 Database configuration (Runs out of the box with zero external configuration)
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=9a3f2c4e6b8a1d0f5e7c3b9a2d4f6e8a0c2e4b6d8f0a2c4e6b8a1d0f5e7c3b9a
app.jwt.expiration-ms=86400000

